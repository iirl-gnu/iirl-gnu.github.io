# 오픈랩 데모 영상. 홈 화면과 Research 페이지에 표시됩니다.
#
# 새 영상 추가 방법:
#   1. media/demos/ 폴더에 영상(mp4 권장, 25MB 이하 권장)과 대표 이미지(jpg)를 넣습니다.
#   2. 아래 형식으로 항목을 추가합니다. 위에 있을수록 홈 화면 앞쪽에 나옵니다.
#
#   - id: my-demo                       # 영어 소문자와 - 만 사용
#     title: 영상 제목
#     caption: 한두 문장 설명
#     video: media/demos/my-demo.mp4
#     poster: media/demos/my-demo.jpg
#     area: physical-ai                 # research.yml의 연구분야 id
#     portrait: true                    # 세로 영상이면 true
#     featured: true                    # 홈 화면 맨 위 큰 영상으로 쓰려면 (하나만)

